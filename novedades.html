<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades | Pablo PMC Pianista</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        nav {
            margin-bottom: 30px;
            padding: 10px 0;
        }
        nav a {
            color: #d4af37;
            text-decoration: none;
            font-size: 1.1em;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 30px;
        }
        /* Tarjeta principal */
        .post {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* Recuadro Amarillo */
        .badge-amarillo {
            display: block;
            background-color: #ffd700;
            color: #000;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(255, 215, 0, 0.2);
        }
        /* Botón de Reservar Entradas */
        .btn-ticket {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #d4af37;
            color: #000;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-ticket:hover {
            background-color: #f1c40f;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Menú de navegación -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="cv.html">CV</a>
            <a href="novedades.html">Novedades</a>
        </nav>

        <h1>Novedades</h1>

        <article class="post">
            <!-- Recuadro Amarillo con el evento -->
            <div class="badge-amarillo">
                XX Ciclo de Música de Cámara de la OFM
            </div>

            <!-- Botón interactivo para comprar/reservar entradas con icono de ticket -->
            <a href="https://tickets.museopicassomalaga.org/es/854-actividades/14093-xx-ciclo-de-musica-de-camara-de-la-ofm/17564203-trio-destenay" target="_blank" class="btn-ticket">
                🎟️ Reservar entradas
            </a>
        </article>

    </div>

</body>
