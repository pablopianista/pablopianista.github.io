
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novedades</title>
  <!-- Iconos de Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* Estilos generales y fondo idéntico al inicio */
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117; /* Fondo oscuro idéntico a inicio (ajustar a #121212 o similar si usas otro) */
      color: #f0f6fc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Menú Superior con Círculos Dorados */
    nav.nav-circulos {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 30px;
      margin-bottom: 40px;
    }

    .circulo-dorado {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      background: radial-gradient(circle, #2a2208 0%, #110e03 100%);
      color: #f3e5ab;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
    }

    .circulo-dorado i {
      font-size: 18px;
      margin-bottom: 4px;
      color: #d4af37;
    }

    .circulo-dorado:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: #f3e5ab;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      color: #ffffff;
    }

    .circulo-dorado:hover i {
      color: #ffffff;
    }

    /* Recuadro de Novedad */
    .tarjeta-novedad {
      background-color: #161b22;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: left;
    }

    .badge-fecha {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(212, 175, 55, 0.15);
      color: #f3e5ab;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .titulo-novedad {
      margin: 0 0 24px 0;
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
    }

    .btn-ticket {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      color: #000000;
      font-weight: 800;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
      transition: all 0.2s ease;
    }

    .btn-ticket:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.5);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <!-- Círculos dorados en la parte superior -->
  <nav class="nav-circulos">
    <a href="index.html" class="circulo-dorado">
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
    </a>
    <a href="novedades.html" class="circulo-dorado">
      <i class="fa-solid fa-newspaper"></i>
      <span>Novedades</span>
    </a>
  </nav>

  <!-- Tarjeta del evento -->
  <div class="tarjeta-novedad">
    
    <!-- 1. Fecha con icono de agenda -->
    <div class="badge-fecha">
      <i class="fa-regular fa-calendar-days"></i>
      <span>13 de Octubre de 2026</span>
    </div>

    <!-- 2. Título -->
    <h3 class="titulo-novedad">
      XX Ciclo de Música de Cámara de la OFM
    </h3>

    <!-- 3. Botón de Reserva con ticket -->
    <a href="https://tickets.museopicassomalaga.org/es/854-actividades/14093-xx-ciclo-de-musica-de-camara-de-la-ofm/17564203-trio-destenay" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn-ticket">
      <i class="fa-solid fa-ticket"></i>
      <span>RESERVA ENTRADAS</span>
    </a>

  </div>

</body>
</html>
