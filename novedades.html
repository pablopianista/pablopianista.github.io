<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades | Pablo Moreno Camacho</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Menú de navegación */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 35px;
            padding: 10px;
        }
        nav a {
            color: #d4af37;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 24px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            background-color: rgba(22, 22, 22, 0.8);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        nav a:hover {
            color: #111;
            background-color: #d4af37;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        /* Títulos en rojo */
        h1, h2, h3 {
            color: #d93838;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 25px;
            font-size: 1.8em;
        }

        /* Tarjetas de eventos */
        .evento {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
        }

        .fecha {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .titulo-evento {
            color: #fff;
            font-size: 1.2em;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .lugar-evento {
            color: #ccc;
            font-size: 1.05em;
            font-weight: 300;
            margin-bottom: 15px;
        }

        /* Botón de enlace / reserva */
        .btn-reserva {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-reserva:hover {
            background-color: #d4af37;
            color: #111;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Menú de navegación -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="novedades.html">Novedades</a>
        </nav>

        <h1>Novedades</h1>

        <!-- Evento 1 (El original de esta mañana) -->
        <div class="evento">
            <div class="fecha">13 de octubre de 2026</div>
            <div class="titulo-evento">XX Ciclo de Música de Cámara de la OFM</div>
            <a href="https://mayea.sacatuevento.es/es/entradas/xx-ciclo-de-musica-de-camara-sesion-2" class="btn-reserva" target="_blank" rel="noopener noreferrer">🎫 Reservar entradas</a>
        </div>

        <!-- Evento 2 (El nuevo añadido con tu mismo formato) -->
        <div class="evento">
            <div class="fecha">3 de junio de 2026</div>
            <div class="titulo-evento">Concierto de Música de Cámara</div>
            <div class="lugar-evento">Conservatorio Músico Ziryab, Córdoba</div>
            <a href="https://drive.google.com/file/d/1-QlOlxsXfPuQV_yAmPtfKv46iyQPC8v3/view?pli=1" class="btn-reserva" target="_blank" rel="noopener noreferrer">ℹ️ +Info</a>
        </div>

    </div>

</body>
</html>
