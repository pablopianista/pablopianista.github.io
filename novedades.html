<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades | Pablo Moreno Camacho</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Menú de navegación elegante con botones circulares e iconos */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 35px;
            padding: 10px;
        }
        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            background-color: rgba(22, 22, 22, 0.8);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        nav a:hover {
            color: #111;
            background-color: #d4af37;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        /* Títulos en rojo */
        h1 {
            color: #d93838;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 35px;
            font-size: 1.8em;
        }

        /* Tarjetas de eventos */
        .evento {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
        }

        .fecha {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .titulo-evento {
            color: #fff;
            font-size: 1.2em;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .lugar-evento {
            color: #ccc;
            font-size: 1.05em;
            font-weight: 300;
            margin-bottom: 15px;
        }

        /* Botón de enlace / reserva */
        .btn-reserva {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-reserva:hover {
            background-color: #d4af37;
            color: #111;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Menú de navegación circular con iconos -->
        <nav>
            <!-- Icono de Inicio (Casa) -->
            <a href="index.html" title="Inicio">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5Z"/>
                    <path d="m8 3.293 4.712 4.712A.5.5 0 0 1 12.5 9h-9a.5.5 0 0 1-.354-.854L8 3.293Z"/>
                </svg>
            </a>
            <!-- Icono de Novedades (Campana) -->
            <a href="novedades.html" title="Novedades">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
                </svg>
            </a>
        </nav>

        <h1>Novedades</h1>

        <!-- Evento 1 -->
        <div class="evento">
            <div class="fecha">13 de octubre de 2026</div>
            <div class="titulo-evento">XX Ciclo de Música de Cámara de la OFM</div>
            <a href="https://tickets.museopicassomalaga.org/es/854-actividades/14093-xx-ciclo-de-musica-de-camara-de-la-ofm/17564203-trio-destenay" class="btn-reserva" target="_blank" rel="noopener noreferrer">🎫 Reservar entradas</a>
        </div>

        <!-- Evento 2 -->
        <div class="evento">
            <div class="fecha">3 de junio de 2026</div>
            <div class="titulo-evento">Concierto de Música de Cámara</div>
            <div class="lugar-evento">Conservatorio Músico Ziryab, Córdoba</div>
            <a href="https://drive.google.com/file/d/1-QlOlxsXfPuQV_yAmPtfKv46iyQPC8v3/view?pli=1" class="btn-reserva" target="_blank" rel="noopener noreferrer">ℹ️ +Info</a>
        </div>

    </div>

</body>
</html>
