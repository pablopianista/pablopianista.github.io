<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades | Pablo PMC Pianista</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        nav {
            margin-bottom: 30px;
            padding: 10px 0;
        }
        nav a {
            color: #d4af37;
            text-decoration: none;
            font-size: 1.1em;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 30px;
        }
        /* Estilo tipo Red Social / Tarjetas */
        .post {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
        }
        .post-author {
            font-weight: bold;
            color: #d4af37;
            font-size: 1.1em;
        }
        .post-date {
            font-size: 0.8em;
            color: #888;
            margin-left: auto;
        }
        .post-content {
            color: #ddd;
            font-size: 1em;
        }
        .badge {
            display: inline-block;
            background-color: #d4af37;
            color: #000;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

</head>

        <!-- Menú de navegación -->
        <nav>

        <article class="post">
            <div class="post-header">
                <span class="post-author">Pablo PMC</span>

            <div class="post-content">
