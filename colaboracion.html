<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colaboracion artistica | Pablo Moreno Camacho</title>
    <!-- Tipografía clásica y elegante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            /* Fondo base tono papiro con textura suave */
            background-color: #f4ecd8;
            background-image: linear-gradient(rgba(244, 236, 216, 0.85), rgba(244, 236, 216, 0.85)), url('papiroimage.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #2b2219;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.8;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Menú de navegación circular con iconos */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 35px;
            padding: 10px;
        }

        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            color: #8c6d3f;
            text-decoration: none;
            border: 1px solid #8c6d3f;
            border-radius: 50%;
            background-color: rgba(250, 246, 237, 0.9);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        nav a:hover {
            color: #f4ecd8;
            background-color: #8c6d3f;
            box-shadow: 0 0 10px rgba(140, 109, 63, 0.4);
            transform: translateY(-2px);
        }

        /* Título Principal */
        h1 {
            font-size: 2.2em;
            font-weight: 600;
            letter-spacing: 1px;
            color: #721c1c;
            margin-bottom: 30px;
        }

        /* Bloque de Colaboraciones */
        .servicios-list {
            list-style: none;
            padding: 0;
            margin: 0 auto 35px auto;
            max-width: 600px;
            text-align: left;
        }

        .servicios-list li {
            font-size: 1.3em;
            color: #2b2219;
            padding: 12px 20px;
            margin-bottom: 12px;
            background-color: rgba(255, 253, 248, 0.7);
            backdrop-filter: blur(4px);
            border-left: 3px solid #8c6d3f;
            border-radius: 0 6px 6px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .servicios-list li .icono {
            color: #8c6d3f;
            font-size: 1.1em;
        }

        /* Botón de Contacto / Disponibilidad */
        .btn-disponibilidad {
            display: inline-block;
            color: #ffffff;
            background-color: #721c1c;
            text-decoration: none;
            border: 1px solid #721c1c;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-bottom: 50px;
            box-shadow: 0 4px 12px rgba(114, 28, 28, 0.2);
        }

        .btn-disponibilidad:hover {
            background-color: #8b2323;
            border-color: #8b2323;
            box-shadow: 0 6px 16px rgba(114, 28, 28, 0.35);
            transform: translateY(-2px);
        }

        /* Sección de Vídeos */
        .videos-section {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(140, 109, 63, 0.3);
            margin-bottom: 30px;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Adaptación a móviles */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            .servicios-list li {
                font-size: 1.15em;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Menú de navegación circular con iconos -->
        <nav>
            <!-- 1. Inicio -->
            <a href="index.html" title="Inicio">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5Z"/>

                </svg>
            </a>
            <!-- 2. Biografía -->
            <a href="bio.html" title="Biografía">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                </svg>
            </a>
            <!-- 3. Novedades -->
            <a href="novedades.html" title="Novedades">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/>
                    <path d="M4.5 6a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1h-7zm0 2.5a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1h-7zm0 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1h-4z"/>
                </svg>
            </a>
        </nav>

        <h1>Colaboración Artística</h1>

        <!-- Lista con símbolos elegantes de música/arte -->
        <ul class="servicios-list">
            <li><span class="icono">♩</span> Pruebas de orquesta</li>
            <li><span class="icono">♪</span> Pruebas de acceso a enseñanzas superiores y máster con pianista</li>
            <li><span class="icono">♫</span> Recitales y conciertos</li>
            <li><span class="icono">♬</span> Ensayos y grabaciones</li>
        </ul>

        <!-- Botón que abre directamente la redacción de un correo -->
        <a href="mailto:pablopianista1991@yahoo.com?subject=Consulta%20de%20Disponibilidad%20-%20Colaboraci%C3%B3n%20Art%C3%ADstica" class="btn-disponibilidad">✉ Consultar disponibilidad</a>

        <!-- Sección de vídeos de YouTube integrados -->
        <div class="videos-section">
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/lnPf0G1vmws" title="Vídeo de YouTube 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/6GNx_GvwtpQ" title="Vídeo de YouTube 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

    </div>

</body>
</html>
