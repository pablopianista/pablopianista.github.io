<!DOCTYPE html><html lang="es"><head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo Moreno Camacho</title>
    <!-- Tipografía clásica, fina y distinguida -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Fondo tono papiro/pergamino liso */
            background-color: #f4ecd8;
            color: #2b2219;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Menú de navegación con botones circulares e iconos en el margen superior */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 25px;
            padding: 10px;
            flex-wrap: wrap;
        }
        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: #8c6d3f;
            text-decoration: none;
            border: 1px solid #8c6d3f;
            border-radius: 50%; /* Círculos perfectos */
            background-color: rgba(250, 246, 237, 0.9);
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            position: relative;
        }
        nav a:hover {
            color: #f4ecd8;
            background-color: #8c6d3f;
            box-shadow: 0 0 10px rgba(140, 109, 63, 0.4);
            transform: translateY(-2px);
        }

        /* Etiqueta flotante explicativa al pasar el cursor por cada círculo */
        nav a::after {
            content: attr(title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2b2219;
            color: #f4ecd8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            font-family: sans-serif;
        }
        nav a:hover::after {
            opacity: 1;
        }

        /* NOMBRE PRINCIPAL */
        .nombre-artista {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6em;
            font-weight: 600;
            letter-spacing: 1px;
            color: #721c1c; /* Rojo borgoña orgánico */
            margin-top: 15px;
            margin-bottom: 25px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Imagen sin bordes visibles y con tamaño reducido */
        .foto-principal {
            max-width: 70%; /* Tamaño ajustado */
            height: auto;
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeIn 2.5s ease-in forwards;

            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 75%);
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 75%);

            mix-blend-mode: multiply;
            filter: sepia(0.12) contrast(1.08);
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 0.95;
                transform: translateY(0);
            }
        }

        /* Adaptación móvil */
        @media (max-width: 600px) {
            .nombre-artista {
                font-size: 2em;
            }
            .foto-principal {
                max-width: 85%;
            }
            nav {
                gap: 12px;
            }
            nav a {
                width: 42px;
                height: 42px;
            }
        }
    </style></head><body>

    <div class="container">

            <!-- Novedades: Icono Periódico / Noticias -->
            <a href="novedades.html" title="Novedades">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M0 2.5A1.5 1.5 0 0 1 1.5 1h11A1.5 1.5 0 0 1 14 2.5v10.528c0 .3-.05.654-.238.972h.738a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 1 1 0v9a1.5 1.5 0 0 1-1.5 1.5H1.497A1.497 1.497 0 0 1 0 13.5v-11zM12 14c.37 0 .654-.211.853-.441.092-.106.147-.229.147-.359V2.5a.5.5 0 0 0-.5-.5h-11a.5.5 0 0 0-.5.5v11c0 .278.223.5.497.5H12z"/>

            <!-- Colaboración Artística: Icono Pincel y Notas / Símbolo de Arte -->
            <a href="colaboracion.html" title="Colaboración artística">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm1.5 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-5 2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-1 5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7.5.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
                </svg>
            </a>
        </nav>

        <!-- NOMBRE DESTACADO -->
        <h1 class="nombre-artista">Pablo Moreno Camacho</h1>

        <!-- Audio de fondo -->
        <audio id="audio-fondo" loop preload="auto">
            <source src="sospiro.mp3" type="audio/mpeg">
        </audio>

        <!-- Imagen principal -->
        <img src="Imagen%20de%20Codex%202%20sept%202026,%2020_16_01.png" alt="Pablo Moreno Camacho" class="foto-principal">

    </div>

    <!-- Script de audio -->
    <script>
        const audio = document.getElementById('audio-fondo');

        function reproducir() {
            if (audio.paused) {
                audio.play().catch(function(e) {
                    console.log("Esperando interacción del usuario...");
                });
            }
        }

        window.addEventListener('load', reproducir);
        document.addEventListener('click', reproducir, { once: true });
        document.addEventListener('touchstart', reproducir, { once: true });
    </script></body></html>
