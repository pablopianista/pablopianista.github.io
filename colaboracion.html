    <!-- Tipografía clásica, fina y distinguida -->

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Fondo tono papiro/pergamino liso */
            background-color: #f4ecd8;
            color: #2b2219;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* Menú de navegación con botones circulares e iconos en el margen superior */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 35px;
            padding: 10px;
            flex-wrap: wrap;
        }
        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: #8c6d3f;
            text-decoration: none;
            border: 1px solid #8c6d3f;
            border-radius: 50%; /* Círculos perfectos */
            background-color: rgba(250, 246, 237, 0.9);
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            position: relative;
        }
        nav a:hover {
            color: #f4ecd8;
            background-color: #8c6d3f;
            box-shadow: 0 0 10px rgba(140, 109, 63, 0.4);
            transform: translateY(-2px);
        }

        /* Etiqueta flotante explicativa al pasar el cursor por cada círculo */
        nav a::after {
            content: attr(title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2b2219;
            color: #f4ecd8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            font-family: sans-serif;
        }
        nav a:hover::after {
            opacity: 1;
        }

        /* Encabezado introductorio para la lista de servicios */
        .servicios-titulo {
            font-size: 1.6em;
            font-weight: 700;
            color: #721c1c;
            margin-top: 10px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Lista elegante de servicios con símbolos artísticos */
        .servicios-lista {
            list-style: none;
            padding: 0;
            margin: 0 auto 40px auto;
            max-width: 700px;
            text-align: left;
        }
        .servicios-lista li {
            font-size: 1.35em;
            font-weight: 600;
            color: #2b2219;
            padding: 14px 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(140, 109, 63, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .servicios-lista li:last-child {
            border-bottom: none;
        }
        .servicios-lista li:hover {
            color: #721c1c;
            transform: translateX(5px);
        }
        .servicios-lista .simbolo {
            color: #8c6d3f;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        .servicios-lista li:hover .simbolo {
            color: #721c1c;
        }

        /* Sección de vídeos nativos limpia y elegante */
        .videos-seccion {
            margin: 35px 0 45px 0;
        }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 820px;
            margin: 0 auto;
        }

        /* Estilo para los vídeos MP4 nativos */
        .video-player {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(43, 34, 25, 0.12);
            background-color: #000;
            outline: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .video-player:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(114, 28, 28, 0.18);
        }

        /* Botón representativo de consulta de disponibilidad */
        .btn-consultar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25em;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f4ecd8;
            background-color: #721c1c;
            border: 1px solid #721c1c;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(114, 28, 28, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
            margin-bottom: 30px;
            cursor: pointer;
        }
        .btn-consultar:hover {
            background-color: #8c6d3f;
            border-color: #8c6d3f;
            color: #f4ecd8;
            box-shadow: 0 0 14px rgba(140, 109, 63, 0.5);
            transform: translateY(-2px);
        }

        /* Modal para la reserva y selección de huecos (Time Slots) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(43, 34, 25, 0.6);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #fdfaf3;
            border: 2px solid #8c6d3f;
            border-radius: 12px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: left;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #8c6d3f;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close:hover {
            color: #721c1c;
        }
        .modal-title {
            font-size: 1.8em;
            color: #721c1c;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 6px;
            color: #2b2219;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #8c6d3f;
            border-radius: 6px;
            background-color: #f4ecd8;
            font-family: inherit;
            font-size: 1em;
            color: #2b2219;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #721c1c;
            box-shadow: 0 0 5px rgba(114, 28, 28, 0.3);
        }

        /* Selector de múltiples fechas con picker */
        .multi-date-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .multi-date-container input[type="text"] {
            flex-grow: 1;
        }
        .btn-picker {
            padding: 9px 12px;
            background-color: #8c6d3f;
            color: #f4ecd8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        .btn-picker:hover {
            background-color: #721c1c;
        }

        /* Grid para seleccionar múltiples franjas horarias */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }
        .slot-btn {
            padding: 8px;
            border: 1px solid #8c6d3f;
            background-color: #f4ecd8;
            color: #2b2219;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95em;
            text-align: center;
            transition: all 0.2s ease;
        }
        .slot-btn:hover:not(:disabled) {
            border-color: #721c1c;
            color: #721c1c;
        }
        .slot-btn.selected {
            background-color: #721c1c;
            color: #f4ecd8;
            border-color: #721c1c;
        }
        .slot-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #ccc;
            background-color: #e5ded0;
        }
        .btn-enviar-reserva {
            width: 100%;
            padding: 12px;
            background-color: #721c1c;
            color: #f4ecd8;
            border: none;
            border-radius: 25px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        .btn-enviar-reserva:hover {
            background-color: #8c6d3f;
        }

        /* Adaptación móvil */
        @media (max-width: 600px) {
            .servicios-titulo {
                font-size: 1.35em;
            }
            .servicios-lista li {
                font-size: 1.15em;
                padding: 12px 10px;
            }
            .btn-consultar {
                padding: 12px 22px;
                font-size: 1.1em;
            }
            nav {
                gap: 12px;
            }
            nav a {
                width: 42px;
                height: 42px;
            }
            .slots-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

    <!-- Scripts de funcionalidad del formulario y audio -->
    <script>
        // Lógica para reproducir el audio de fondo
        const audio = document.getElementById('audio-fondo');

        function reproducir() {
            if (audio.paused) {
                audio.play().catch(function(e) {
                    console.log("Esperando interacción del usuario...");
                });
            }
        }

        window.addEventListener('load', reproducir);
        document.addEventListener('click', reproducir, { once: true });
        document.addEventListener('touchstart', reproducir, { once: true });

        // Control del Modal de Consulta y Reserva
        const modal = document.getElementById('modal-reserva');
        const btnAbrir = document.getElementById('btn-abrir-modal');
        const btnCerrar = document.getElementById('btn-cerrar-modal');
        const slots = document.querySelectorAll('.slot-btn');

        btnAbrir.onclick = function() {
            modal.style.display = "flex";
        }

        btnCerrar.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Selección de fechas con filtro de días disponibles y franjas adaptativas
        const hiddenDatePicker = document.getElementById('hidden-date-picker');
        const fechasInput = document.getElementById('fechas');
        const btnCalendarTrigger = document.getElementById('btn-calendar-trigger');

        btnCalendarTrigger.onclick = function() {
            hiddenDatePicker.showPicker();
        };

        hiddenDatePicker.onchange = function() {
            if (this.value) {
                const partes = this.value.split('-');
                const fechaSeleccionada = new Date(partes[0], partes[1] - 1, partes[2]);
                const diaSemana = fechaSeleccionada.getDay(); // 0 = Domingo, 1 = Lunes, 2 = Martes, 3 = Miércoles, 4 = Jueves, 5 = Viernes, 6 = Sábado

                // Restricción para Miércoles (3) y Jueves (4)
                if (diaSemana === 3 || diaSemana === 4) {
                    alert("Lo sentimos, no hay disponibilidad los miércoles ni los jueves.");
                    this.value = '';
                    return;
                }

                const fechaFormateada = `${partes[2]}/${partes[1]}/${partes[0]}`;
                
                if (fechasInput.value.trim() === '') {
                    fechasInput.value = fechaFormateada;
                } else {
                    fechasInput.value += `, ${fechaFormateada}`;
                }

                // Filtrar franjas horarias exactas según el día
                actualizarSlotsHorarios(diaSemana);

                this.value = '';
            }
        };

        function actualizarSlotsHorarios(diaSemana) {
            slots.forEach(slot => {
                slot.classList.remove('selected');
                const time = slot.getAttribute('data-time');

                // Lunes (1), Sábado (6) y Domingo (0): 10-12, 12,30-14,30, 17-19, 19,30-21,30
                if (diaSemana === 1 || diaSemana === 6 || diaSemana === 0) {
                    const permitidas = ['10:00 - 12:00', '12:30 - 14:30', '17:00 - 19:00', '19:30 - 21:30'];
                    slot.disabled = !permitidas.includes(time);
                } 
                // Martes (2): 9:30-11:00, 11:30-13:00
                else if (diaSemana === 2) {
                    const permitidas = ['09:30 - 11:00', '11:30 - 13:00'];
                    slot.disabled = !permitidas.includes(time);
                } 
                // Viernes (5): 18,30-20,30
                else if (diaSemana === 5) {
                    const permitidas = ['18:30 - 20:30'];
                    slot.disabled = !permitidas.includes(time);
                }
            });
        }

        // Selección MÚLTIPLE de Time Slots
        slots.forEach(slot => {
            slot.addEventListener('click', function() {
                if (!this.disabled) {
                    this.classList.toggle('selected');
                }
            });
        });

        // Envío del formulario formateado a correo electrónico
        document.getElementById('form-solicitud').onsubmit = function(e) {
            e.preventDefault();
            
            const slotsSeleccionados = Array.from(document.querySelectorAll('.slot-btn.selected'))
                                             .map(btn => btn.getAttribute('data-time'));

            if (slotsSeleccionados.length === 0) {
                alert("Por favor, selecciona al menos una franja horaria.");
                return;
            }

            const nombre = document.getElementById('nombre').value;
            const mensaje = document.getElementById('mensaje').value;
            const email = document.getElementById('email').value;
            const servicio = document.getElementById('servicio').value;
            const instrumento = document.getElementById('instrumento').value;
            const fechas = document.getElementById('fechas').value;
            const repertorio = document.getElementById('repertorio').value;

            const asunto = encodeURIComponent("Consulta de disponibilidad - " + servicio);
            const cuerpo = encodeURIComponent(
                "Nombre: " + nombre + "\n" +
                "Mensaje:\n" + mensaje + "\n\n" +
                "Email: " + email + "\n" +
                "Servicio: " + servicio + "\n" +
                "Instrumento/s: " + instrumento + "\n" +
                "Fecha/s solicitadas: " + fechas + "\n" +
                "Franja/s horaria/s: " + slotsSeleccionados.join(", ") + "\n\n" +
                "Repertorio:\n" + repertorio
            );

            window.location.href = `mailto:pablopianista1991@yahoo.com?subject=${asunto}&body=${cuerpo}`;
            modal.style.display = "none";
        }
    </script>
</body>
</html>
