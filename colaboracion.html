<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Musicales</title>
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .servicios-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* Estilo para los cuadros de servicio */
        .cuadro-servicio {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cuadro-servicio:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .cuadro-titulo {
            font-size: 1.25rem;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #721c1c;
            padding-bottom: 8px;
        }

        .cuadro-lista {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .cuadro-lista li {
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #555;
            display: flex;
            align-items: center;
        }

        .simbolo {
            margin-right: 8px;
            color: #721c1c;
        }

        /* Estilos para enlaces dentro de las listas */
        .cuadro-lista a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .cuadro-lista a:hover {
            color: #721c1c;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="servicios-container">

        <!-- Cuadro 1 -->
        <div class="cuadro-servicio">
            <h3 class="cuadro-titulo">Música de Cámara</h3>
            <ul class="cuadro-lista">
                <li><span class="simbolo">➤</span> Dúo con voz</li>
                <li><span class="simbolo">➤</span> Dúo con instrumento</li>
                <li><span class="simbolo">➤</span> Trío, cuarteto y quinteto</li>
            </ul>
        </div>

        <!-- Cuadro 2 -->
        <div class="cuadro-servicio">
            <h3 class="cuadro-titulo">Acompañamiento</h3>
            <ul class="cuadro-lista">
                <li><span class="simbolo">➤</span> Pruebas de acceso y oposiciones</li>
                <li><span class="simbolo">➤</span> Concursos y recitales</li>
                <li><span class="simbolo">➤</span> Exámenes de conservatorio</li>
            </ul>
        </div>

        <!-- Cuadro 3: Solista (Modificado con enlace a repiano.html) -->
        <div class="cuadro-servicio">
            <h3 class="cuadro-titulo">Solista</h3>
            <ul class="cuadro-lista">
                <li><span class="simbolo">➤</span> Piano y orquesta</li>
                <li><span class="simbolo">➤</span> <a href="repiano.html">Piano solo</a></li>
            </ul>
        </div>

    </div>

</body>
</html>
