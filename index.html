    <!-- Tipografía clásica, fina y distinguida -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Fondo tono papiro/pergamino liso */
            background-color: #f4ecd8;
            color: #2b2219;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Menú de navegación elegante con texto explícito */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 25px;
            padding: 10px;
            flex-wrap: wrap; /* Asegura buena vista en pantallas pequeñas */
        }
        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            height: 45px;
            color: #8c6d3f;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid #8c6d3f;
            border-radius: 25px; /* Mantienen la forma redondeada/circular elegante */
            background-color: rgba(250, 246, 237, 0.9);
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        nav a:hover {
            color: #f4ecd8;
            background-color: #8c6d3f;
            box-shadow: 0 0 10px rgba(140, 109, 63, 0.4);
            transform: translateY(-2px);
        }

        /* NOMBRE PRINCIPAL */
        .nombre-artista {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6em;
            font-weight: 600;
            letter-spacing: 1px;
            color: #721c1c; /* Rojo borgoña orgánico */
            margin-top: 15px;
            margin-bottom: 25px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Imagen sin bordes visibles y con tamaño reducido */
        .foto-principal {
            max-width: 70%; /* Tamaño ajustado */
            height: auto;
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeIn 2.5s ease-in forwards;

            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 75%);
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 75%);

            mix-blend-mode: multiply;
            filter: sepia(0.12) contrast(1.08);
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 0.95;
                transform: translateY(0);
            }
        }

        /* Redes Sociales e Iconos alineados a la izquierda */
        .redes-sociales {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }
        .redes-sociales a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            color: #8c6d3f;
            text-decoration: none;
            border: 1px solid #8c6d3f;
            border-radius: 50%;
            background-color: rgba(250, 246, 237, 0.9);
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .redes-sociales a:hover {
            color: #f4ecd8;
            background-color: #8c6d3f;
            box-shadow: 0 0 10px rgba(140, 109, 63, 0.4);
            transform: translateY(-2px);
        }

        /* Sección de vídeos sin recuadros e integrados con el fondo */
        .seccion-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        .video-player {
            width: 100%;
            height: auto;
            background-color: transparent;
            border: none;
            outline: none;
            
            /* Difuminado suave de los bordes del vídeo hacia el papiro */
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 98%);
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 98%);
            
            mix-blend-mode: multiply;
            filter: blur(1.2px) sepia(0.12);
            opacity: 0.85;
            transition: all 0.4s ease;
        }
        .video-player:hover,
        .video-player:focus {
            filter: blur(0px) sepia(0);
            opacity: 1;
            transform: scale(1.02);
        }

        /* SECCIÓN DE BANDERAS AL FINAL (sin círculos) */
        .banderas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
            padding: 10px;
        }

        .bandera-link {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .bandera-link:hover {
            transform: translateY(-2px);
            opacity: 0.85;
        }

        .bandera-icon {
            width: 36px;
            height: 24px;
            display: block;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }

        /* Adaptación móvil */
        @media (max-width: 600px) {
            .nombre-artista {
                font-size: 2em;
            }
            .foto-principal {
                max-width: 85%;
            }
            nav {
                gap: 10px;
            }
            nav a {
                padding: 0 12px;
                font-size: 0.95em;
            }
            .seccion-videos {
                grid-template-columns: 1fr;
            }
            .banderas-container {
                gap: 15px;
            }
            .bandera-icon {
                width: 32px;
                height: 21px;
            }
        }
    </style>
</head>

    <!-- Script de audio -->
    <script>
        const audio = document.getElementById('audio-fondo');

        function reproducir() {
            if (audio.paused) {
                audio.play().catch(function(e) {
                    console.log("Esperando interacción del usuario...");
                });
            }
        }

        window.addEventListener('load', reproducir);
        document.addEventListener('click', reproducir, { once: true });
        document.addEventListener('touchstart', reproducir, { once: true });
